[project]
name = "provenance-notebook"
version = "0.1.0"
description = "A tamper-evident trail of an AI-assisted research task: plans, runs, observations and reviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "pyarrow>=18"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "duckdb>=1.3,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
# A brief's workspace is a snapshot of code an agent wrote in an earlier trail: it is kept as it was.
extend-exclude = ["capture/node_modules", "research/*/briefs/*/workspace"]

[tool.ruff.lint.per-file-ignores]
# A dense demo script: several statements on a line are its style.
"scripts/cross.py" = ["E401", "E402", "E701", "E702", "I001"]

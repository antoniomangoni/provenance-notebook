name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update -q && sudo apt-get install -y -q strace
      - run: uv sync --locked
      - run: npm ci --prefix capture
      - run: uv run ruff check
      - run: uv run pytest
      - run: uv run python trail.py view examples/churn-model-2026-11-11 --store examples/store --out site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: view
          path: site/
